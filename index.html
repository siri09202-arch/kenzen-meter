<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>各ユーザー健全度メーター</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- PapaParse for parsing CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
          },
          animation: {
            'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'fadeIn': 'fadeIn 0.3s ease-in-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(6px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar for tab navigation */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
      
      <!-- Title & Status -->
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600/20 rounded-xl border border-indigo-500/30 text-indigo-400">
          <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-lg md:text-xl font-bold bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">
            各ユーザーの健全度メーター
          </h1>
          <p class="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
            <span id="statusIndicator" class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
            <span id="statusText">データロード待機中</span>
          </p>
        </div>
      </div>

      <!-- Settings & Controls Bar -->
      <div class="flex flex-wrap items-center gap-2 justify-end">
        
        <!-- ユーザー追加リクエスト ボタン -->
        <button id="requestUserBtn" class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition flex items-center gap-1.5 shadow-sm">
          <i data-lucide="user-plus" class="w-3.5 h-3.5"></i>
          <span class="hidden md:inline">ユーザー追加リクエスト</span>
          <span class="md:hidden">追加</span>
        </button>
        
        <!-- 基準 ボタン -->
        <button id="criteriaBtn" class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition flex items-center gap-1.5 shadow-sm">
          <i data-lucide="info" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">健全度メーターの基準</span>
          <span class="sm:hidden">基準</span>
        </button>

        <!-- 更新 ボタン -->
        <button id="reloadCsvBtn" class="px-3 py-1.5 text-xs font-medium bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition shadow-sm shadow-indigo-600/30 flex items-center gap-1.5">
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5" id="reloadIcon"></i>
          <span class="hidden sm:inline">最新データ更新</span>
          <span class="sm:hidden">更新</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full space-y-6">

    <!-- Slideshow Top Toolbar -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-5 shadow-xl relative overflow-hidden">
      <!-- 10-Second Progress Bar Timer -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-slate-800">
        <div id="timerProgress" class="h-full bg-indigo-500 transition-all duration-100 ease-linear" style="width: 0%;"></div>
      </div>

      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mt-1">
        
        <!-- Active Range Title Display -->
        <div class="flex items-center gap-3">
          <div id="rangeColorBadge" class="w-4 h-10 rounded-lg bg-gradient-to-b from-emerald-400 to-emerald-600 shadow-md"></div>
          <div>
            <div class="text-xs font-semibold tracking-wider text-slate-400 uppercase">現在の表示範囲 (10秒切り替え)</div>
            <div class="flex items-baseline gap-3">
              <h2 id="currentRangeTitle" class="text-2xl md:text-3xl font-extrabold text-white tracking-tight">
                健全度 90%〜100%
              </h2>
              <span id="rangeItemCount" class="text-xs md:text-sm font-medium px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
                0 件
              </span>
            </div>
          </div>
        </div>

        <!-- Controls: Play/Pause, Next/Prev, Settings -->
        <div class="flex flex-wrap items-center gap-2 sm:gap-3">
          <!-- Prev Button -->
          <button id="prevBtn" title="前の範囲へ" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl border border-slate-700 transition active:scale-95">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
          </button>

          <!-- Play/Pause Button -->
          <button id="playPauseBtn" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-medium transition shadow-lg shadow-indigo-600/30 flex items-center gap-2 active:scale-95">
            <i data-lucide="pause" id="playPauseIcon" class="w-5 h-5"></i>
            <span id="playPauseText" class="text-xs md:text-sm font-semibold">一時停止</span>
          </button>

          <!-- Next Button -->
          <button id="nextBtn" title="次の範囲へ" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl border border-slate-700 transition active:scale-95">
            <i data-lucide="chevron-right" class="w-5 h-5"></i>
          </button>

          <div class="h-6 w-px bg-slate-800 mx-1 hidden sm:block"></div>

          <!-- Auto Skip Empty Ranges Toggle -->
          <label class="flex items-center gap-2 px-3 py-2 bg-slate-950/60 rounded-xl border border-slate-800/80 cursor-pointer select-none hover:border-slate-700 transition">
            <input type="checkbox" id="skipEmptyToggle" checked class="w-4 h-4 rounded border-slate-700 text-indigo-600 focus:ring-indigo-500 bg-slate-900" />
            <span class="text-xs text-slate-300">データなしの範囲をスキップ</span>
          </label>
        </div>

      </div>
    </div>

    <!-- Main Display Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-2xl min-h-[420px] flex flex-col justify-between">
      
      <!-- List Header & Search Filter -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pb-4 mb-4 border-b border-slate-800/80">
        <div class="flex items-center gap-2 text-slate-300 text-sm font-semibold">
          <i data-lucide="list" class="w-4 h-4 text-indigo-400"></i>
          <span>該当データ一覧</span>
        </div>

        <!-- Search Filter -->
        <div class="relative w-full sm:w-64">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-500"></i>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="名前で検索..." 
            class="w-full bg-slate-950 text-slate-200 text-xs pl-9 pr-3 py-2 rounded-xl border border-slate-800 focus:outline-none focus:border-indigo-500 transition"
          />
        </div>
      </div>

      <!-- Main Horizontal Bars Container -->
      <div id="chartItemsList" class="flex-1 animate-fadeIn border border-slate-800 rounded-lg overflow-hidden flex flex-col bg-slate-900 shadow-inner">
        <!-- Dynamic Row Items Go Here -->
      </div>

      <!-- Empty State View -->
      <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center py-16 text-center">
        <div class="p-4 bg-slate-800/50 rounded-full text-slate-500 mb-3 border border-slate-700/50">
          <i data-lucide="inbox" class="w-10 h-10"></i>
        </div>
        <h3 class="text-base font-semibold text-slate-300">この範囲（<span id="emptyRangeName"></span>）にはデータがありません</h3>
        <p class="text-xs text-slate-500 mt-1 max-w-sm">他の範囲を選択するか、設定で「データなしの範囲をスキップ」を有効にしてください。</p>
      </div>

      <!-- Footer Info -->
      <div class="pt-4 mt-6 border-t border-slate-800/60 flex flex-wrap justify-end items-center text-xs text-slate-500 gap-2">
        <div>
          全データ件数: <span id="totalDataCount" class="font-bold text-slate-300">0</span> 件
        </div>
      </div>

    </div>

  </main>

  <!-- Modals -->
  <!-- 基準モーダル -->
  <div id="criteriaModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm transition-opacity">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden animate-fadeIn">
      <div class="flex justify-between items-center p-4 border-b border-slate-800">
        <h3 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="info" class="w-5 h-5 text-indigo-400"></i>健全度メーターの基準</h3>
        <button id="closeCriteriaBtn" class="text-slate-400 hover:text-white transition p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-6 text-center text-slate-200">
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 text-base sm:text-lg font-bold bg-slate-950 p-6 rounded-xl border border-slate-800 shadow-inner">
          <span class="text-emerald-400">［健全］ 100%</span>
          <i data-lucide="arrow-left" class="w-5 h-5 text-slate-500 hidden sm:block"></i>
          <i data-lucide="arrow-up" class="w-5 h-5 text-slate-500 sm:hidden"></i>
          <span class="text-white">0%</span>
          <i data-lucide="arrow-right" class="w-5 h-5 text-slate-500 hidden sm:block"></i>
          <i data-lucide="arrow-down" class="w-5 h-5 text-slate-500 sm:hidden"></i>
          <span class="text-rose-500">-100% ［不健全］</span>
        </div>
      </div>
      <div class="p-4 border-t border-slate-800 flex justify-end">
        <button id="closeCriteriaBtn2" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-white text-sm font-medium rounded-lg transition border border-slate-700 active:scale-95">閉じる</button>
      </div>
    </div>
  </div>

  <!-- ユーザー追加リクエストモーダル -->
  <div id="requestModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm transition-opacity">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl max-w-2xl w-full h-[85vh] flex flex-col overflow-hidden animate-fadeIn">
      <div class="flex justify-between items-center p-4 border-b border-slate-800 shrink-0">
        <h3 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="user-plus" class="w-5 h-5 text-indigo-400"></i>ユーザー追加リクエスト</h3>
        <button id="closeRequestBtn" class="text-slate-400 hover:text-white transition p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="flex-1 w-full bg-slate-50 relative overflow-hidden">
        <!-- iOS/Android等でのスムーズなスクロールを考慮 -->
        <div class="absolute inset-0 overflow-y-auto overflow-x-hidden flex justify-center -webkit-overflow-scrolling-touch pt-4 pb-10">
          <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdwm9fptdG84NG4FYzY6H3rGrMULwTsz-WFyOL1mebRfGYuSg/viewform?embedded=true" class="w-full max-w-[640px] h-[800px] border-0" frameborder="0" marginheight="0" marginwidth="0">読み込んでいます…</iframe>
        </div>
      </div>
      <div class="p-4 border-t border-slate-800 flex justify-end shrink-0">
        <button id="closeRequestBtn2" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-white text-sm font-medium rounded-lg transition border border-slate-700 active:scale-95">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    // Range Definitions matching requested spec exactly in order:
    // 90%〜100%, 80%〜89%, ..., -91%〜-100%
    const RANGES = [
      { id: 'r90_100', label: '90%〜100%', min: 90, max: 100, color: 'from-emerald-500 to-green-400', textColor: 'text-emerald-400', border: 'border-emerald-500' },
      { id: 'r80_89',  label: '80%〜89%', min: 80, max: 89.999, color: 'from-emerald-600 to-emerald-400', textColor: 'text-emerald-400', border: 'border-emerald-500' },
      { id: 'r70_79',  label: '70%〜79%', min: 70, max: 79.999, color: 'from-teal-500 to-emerald-500', textColor: 'text-teal-400', border: 'border-teal-500' },
      { id: 'r60_69',  label: '60%〜69%', min: 60, max: 69.999, color: 'from-teal-600 to-teal-400', textColor: 'text-teal-400', border: 'border-teal-500' },
      { id: 'r50_59',  label: '50%〜59%', min: 50, max: 59.999, color: 'from-cyan-500 to-teal-400', textColor: 'text-cyan-400', border: 'border-cyan-500' },
      { id: 'r40_49',  label: '40%〜49%', min: 40, max: 49.999, color: 'from-sky-500 to-cyan-400', textColor: 'text-sky-400', border: 'border-sky-500' },
      { id: 'r30_39',  label: '30%〜39%', min: 30, max: 39.999, color: 'from-blue-500 to-sky-400', textColor: 'text-blue-400', border: 'border-blue-500' },
      { id: 'r20_29',  label: '20%〜29%', min: 20, max: 29.999, color: 'from-blue-600 to-indigo-400', textColor: 'text-blue-400', border: 'border-blue-500' },
      { id: 'r10_19',  label: '10%〜19%', min: 10, max: 19.999, color: 'from-indigo-500 to-blue-400', textColor: 'text-indigo-400', border: 'border-indigo-500' },
      { id: 'r0_9',    label: '0%〜9%', min: 0, max: 9.999, color: 'from-yellow-400 to-amber-500', textColor: 'text-yellow-400', border: 'border-yellow-500' },
      { id: 'rn1_10',  label: '-1%〜-10%', min: -10, max: -0.001, color: 'from-amber-500 to-orange-500', textColor: 'text-amber-400', border: 'border-amber-500' },
      { id: 'rn11_20', label: '-11%〜-20%', min: -20, max: -10.001, color: 'from-orange-500 to-amber-600', textColor: 'text-orange-400', border: 'border-orange-500' },
      { id: 'rn21_30', label: '-21%〜-30%', min: -30, max: -20.001, color: 'from-orange-600 to-red-500', textColor: 'text-orange-400', border: 'border-orange-500' },
      { id: 'rn31_40', label: '-31%〜-40%', min: -40, max: -30.001, color: 'from-red-500 to-orange-500', textColor: 'text-red-400', border: 'border-red-500' },
      { id: 'rn41_50', label: '-41%〜-50%', min: -50, max: -40.001, color: 'from-red-600 to-red-400', textColor: 'text-red-400', border: 'border-red-500' },
      { id: 'rn51_60', label: '-51%〜-60%', min: -60, max: -50.001, color: 'from-red-700 to-red-500', textColor: 'text-red-400', border: 'border-red-500' },
      { id: 'rn61_70', label: '-61%〜-70%', min: -70, max: -60.001, color: 'from-rose-700 to-red-600', textColor: 'text-rose-400', border: 'border-rose-500' },
      { id: 'rn71_80', label: '-71%〜-80%', min: -80, max: -70.001, color: 'from-rose-800 to-rose-600', textColor: 'text-rose-400', border: 'border-rose-500' },
      { id: 'rn81_90', label: '-81%〜-90%', min: -90, max: -80.001, color: 'from-pink-900 to-rose-700', textColor: 'text-pink-400', border: 'border-pink-500' },
      { id: 'rn91_100',label: '-91%〜-100%', min: -100, max: -90.001, color: 'from-purple-900 to-pink-800', textColor: 'text-purple-400', border: 'border-purple-500' }
    ];

    // Application State
    let rawParsedData = [];
    let currentRangeIndex = 0; // Starts at 90%〜100%
    let isPlaying = true;
    let timerInterval = null;
    let timerProgressMs = 0;
    const TIMER_DURATION_MS = 10000; // 10 seconds per slide requirement
    const TICK_INTERVAL_MS = 100;

    // Sample fallback data in case fetching external CSV fails or offline
    const SAMPLE_DATA = [
      { name: 'アルファプロジェクト', value: 95.5 },
      { name: 'ベータソリューションズ', value: 92.0 },
      { name: 'ガンマシステム', value: 88.4 },
      { name: 'デルタネットワークス', value: 81.2 },
      { name: 'エプシロンクラウド', value: 75.0 },
      { name: 'ゼータマーケティング', value: 68.3 },
      { name: 'イータロジスティクス', value: 54.1 },
      { name: 'シータエンジニアリング', value: 42.7 },
      { name: 'イオタホールディングス', value: 33.9 },
      { name: 'カッパフーズ', value: 25.4 },
      { name: 'ラムダケミカル', value: 12.8 },
      { name: 'ミューメディカル', value: 5.2 },
      { name: 'ニューマテリアル', value: -4.5 },
      { name: 'クシーエナジー', value: -8.2 },
      { name: 'オミクロンアパレル', value: -15.6 },
      { name: 'パイセキュリティ', value: -28.0 },
      { name: 'ローロボティクス', value: -35.4 },
      { name: 'シグマコンサルティング', value: -48.2 },
      { name: 'タウインターナショナル', value: -58.0 },
      { name: 'ウプシロンメディア', value: -65.3 },
      { name: 'ファイファイナンス', value: -78.1 },
      { name: 'キーテクノロジーズ', value: -86.7 },
      { name: 'プシーモータース', value: -95.0 }
    ];

    // DOM Elements
    const reloadCsvBtn = document.getElementById('reloadCsvBtn');
    const statusText = document.getElementById('statusText');
    const statusIndicator = document.getElementById('statusIndicator');
    const currentRangeTitle = document.getElementById('currentRangeTitle');
    const rangeItemCount = document.getElementById('rangeItemCount');
    const rangeColorBadge = document.getElementById('rangeColorBadge');
    const chartItemsList = document.getElementById('chartItemsList');
    const emptyState = document.getElementById('emptyState');
    const emptyRangeName = document.getElementById('emptyRangeName');
    const totalDataCount = document.getElementById('totalDataCount');
    const timerProgress = document.getElementById('timerProgress');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playPauseIcon = document.getElementById('playPauseIcon');
    const playPauseText = document.getElementById('playPauseText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const skipEmptyToggle = document.getElementById('skipEmptyToggle');
    const searchInput = document.getElementById('searchInput');

    // Modal Elements
    const requestUserBtn = document.getElementById('requestUserBtn');
    const requestModal = document.getElementById('requestModal');
    const closeRequestBtn = document.getElementById('closeRequestBtn');
    const closeRequestBtn2 = document.getElementById('closeRequestBtn2');

    const criteriaBtn = document.getElementById('criteriaBtn');
    const criteriaModal = document.getElementById('criteriaModal');
    const closeCriteriaBtn = document.getElementById('closeCriteriaBtn');
    const closeCriteriaBtn2 = document.getElementById('closeCriteriaBtn2');

    // Main CSV Data Fetcher
    async function loadCSVData() {
      const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2ztMg-6X-h0X7h7eNavH0jfZgM8Epq8mlxBXM1pJ_WkicdklUxeE9EZ_L-IEU9AlgPuZNsnhbq3qX/pub?output=csv";
      setStatus('loading', 'CSVデータを取得中...');
      
      const reloadIcon = document.getElementById('reloadIcon');
      if (reloadIcon) reloadIcon.classList.add('animate-spin');

      let csvText = null;

      // 1. Try Direct Fetch
      try {
        const response = await fetch(url);
        if (response.ok) {
          csvText = await response.text();
        }
      } catch (e) {
        console.warn('直接取得に失敗しました。プロキシ経由で試行します...', e);
      }

      // 2. Fallback to AllOrigins Proxy
      if (!csvText || csvText.trim().length === 0) {
        try {
          const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
          const response = await fetch(proxyUrl);
          if (response.ok) {
            csvText = await response.text();
          }
        } catch (e) {
          console.warn('AllOriginsプロキシの取得に失敗しました', e);
        }
      }

      // 3. Fallback to CorsProxy.io
      if (!csvText || csvText.trim().length === 0) {
        try {
          const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
          const response = await fetch(proxyUrl);
          if (response.ok) {
            csvText = await response.text();
          }
        } catch (e) {
          console.warn('CorsProxy取得失敗', e);
        }
      }

      if (reloadIcon) reloadIcon.classList.remove('animate-spin');

      // If fetch succeeded, parse CSV
      if (csvText && csvText.trim().length > 0) {
        parseCSVText(csvText);
        setStatus('online', 'CSV同期完了');
      } else {
        // Fallback to local sample dataset
        console.warn('CSVの取得ができないため、サンプルデータを使用します。');
        rawParsedData = SAMPLE_DATA;
        setStatus('warning', 'サンプルデータ使用中 (取得失敗)');
        processAndRender();
      }
    }

    // Parse CSV Text via PapaParse
    function parseCSVText(csvText) {
      Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            const data = [];
            // Auto-detect columns
            const firstRow = results.data[0];
            const keys = Object.keys(firstRow);

            let nameKey = keys.find(k => k.match(/名前|項目|Name|銘柄|商品|タイトル/i)) || keys[0];
            let valueKey = keys.find(k => k.match(/数値|達成率|率|前日比|パーセント|Value|%|比率/i)) || keys[1] || keys[0];

            results.data.forEach(row => {
              const nameVal = row[nameKey];
              const rawVal = row[valueKey];

              if (nameVal !== undefined && rawVal !== undefined) {
                let cleanVal = String(rawVal).replace(/%/g, '').replace(/,/g, '').trim();
                let num = parseFloat(cleanVal);
                if (!isNaN(num)) {
                  // If standard decimal like 0.85, convert to 85%
                  if (Math.abs(num) <= 1 && Math.abs(num) > 0 && cleanVal.includes('.')) {
                    num = num * 100;
                  }
                  data.push({ name: String(nameVal).trim(), value: num });
                }
              }
            });

            if (data.length > 0) {
              rawParsedData = data;
              processAndRender();
            } else {
              rawParsedData = SAMPLE_DATA;
              processAndRender();
            }
          }
        },
        error: function(err) {
          console.error('CSV Parsing Error:', err);
          rawParsedData = SAMPLE_DATA;
          processAndRender();
        }
      });
    }

    // Status Helper
    function setStatus(type, msg) {
      statusText.innerText = msg;
      if (type === 'online') {
        statusIndicator.className = 'w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse';
      } else if (type === 'warning') {
        statusIndicator.className = 'w-2 h-2 rounded-full bg-amber-500 inline-block';
      } else {
        statusIndicator.className = 'w-2 h-2 rounded-full bg-indigo-500 inline-block animate-ping';
      }
    }

    // Get items belonging to a specific range bucket
    function getItemsForRange(rangeDef) {
      return rawParsedData.filter(item => {
        const val = item.value;
        if (rangeDef.id === 'r90_100') return val >= 90;
        if (rangeDef.id === 'rn91_100') return val < -90;
        return val >= rangeDef.min && val <= rangeDef.max;
      });
    }

    // Render Currently Selected Range View
    function renderCurrentRangeView() {
      const currentRange = RANGES[currentRangeIndex];
      currentRangeTitle.innerText = '健全度 ' + currentRange.label;
      rangeColorBadge.className = `w-4 h-10 rounded-lg bg-gradient-to-b ${currentRange.color} shadow-md`;

      let items = getItemsForRange(currentRange);
      
      // Filter by search text if entered
      const query = searchInput.value.trim().toLowerCase();
      if (query) {
        items = items.filter(i => i.name.toLowerCase().includes(query));
      }

      rangeItemCount.innerText = `${items.length} 件`;
      totalDataCount.innerText = rawParsedData.length;

      chartItemsList.innerHTML = '';

      if (items.length === 0) {
        chartItemsList.classList.add('hidden');
        emptyState.classList.remove('hidden');
        emptyRangeName.innerText = '健全度 ' + currentRange.label;
      } else {
        chartItemsList.classList.remove('hidden');
        emptyState.classList.add('hidden');

        // Sort items descending by absolute magnitude or percentage value
        items.sort((a, b) => b.value - a.value);

        // 各列の凡例（ヘッダー）を追加
        const headerEl = document.createElement('div');
        headerEl.className = "flex items-stretch w-full bg-slate-800 text-slate-200 font-bold text-xs sm:text-sm border-b-2 border-slate-700";
        headerEl.innerHTML = `
          <div class="w-1/3 sm:w-1/4 flex-shrink-0 py-2.5 px-3 sm:px-4 border-r border-slate-700 flex items-center justify-center tracking-wider">
            ユーザー名
          </div>
          <div class="w-16 sm:w-20 flex-shrink-0 py-2.5 px-2 border-r border-slate-700 flex items-center justify-center tracking-wider">
            健全度
          </div>
          <div class="flex-1 py-2.5 px-3 sm:px-4"></div>
        `;
        chartItemsList.appendChild(headerEl);

        items.forEach(item => {
          const rowEl = document.createElement('div');
          rowEl.className = "flex items-stretch w-full bg-slate-950/40 border-b border-slate-800/80 last:border-b-0 hover:bg-slate-800/50 transition-colors";

          // Calculate visual width percentage for horizontal bar
          const absVal = Math.min(100, Math.max(0, Math.abs(item.value)));
          const barWidth = absVal;

          // 整数（四捨五入）にして「%」を付与
          const valFormatted = `${Math.round(item.value)}%`;

          rowEl.innerHTML = `
            <!-- Name Column (左揃え) -->
            <div class="w-1/3 sm:w-1/4 flex-shrink-0 py-3 px-3 sm:px-4 font-medium text-slate-200 text-sm md:text-base border-r border-slate-800/80 truncate flex items-center">
              ${item.name}
            </div>

            <!-- Value Column -->
            <div class="w-16 sm:w-20 flex-shrink-0 py-3 px-2 font-mono font-bold ${currentRange.textColor} text-center text-sm md:text-base border-r border-slate-800/80 flex items-center justify-center">
              ${valFormatted}
            </div>

            <!-- Bar Graph Column (左から右へ) -->
            <div class="flex-1 py-3 px-3 sm:px-4 flex items-center min-w-0">
              <div class="w-full h-5 sm:h-7 overflow-hidden flex justify-start bg-slate-900/50 rounded-sm">
                <div 
                  class="h-full bg-gradient-to-r ${currentRange.color} transition-all duration-500 shadow-sm rounded-r-sm" 
                  style="width: ${barWidth}%;"
                ></div>
              </div>
            </div>
          `;

          chartItemsList.appendChild(rowEl);
        });
      }
    }

    // Timer Ticker Logic
    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerProgressMs = 0;
      updateTimerUI();

      timerInterval = setInterval(() => {
        if (!isPlaying) return;

        timerProgressMs += TICK_INTERVAL_MS;
        updateTimerUI();

        if (timerProgressMs >= TIMER_DURATION_MS) {
          timerProgressMs = 0;
          nextRange();
        }
      }, TICK_INTERVAL_MS);
    }

    function updateTimerUI() {
      const percentage = (timerProgressMs / TIMER_DURATION_MS) * 100;
      timerProgress.style.width = `${percentage}%`;
    }

    // Switch to Next Range in Loop (90% -> ... -> -100% -> 90%)
    function nextRange() {
      let nextIdx = (currentRangeIndex + 1) % RANGES.length;

      // Auto Skip Empty Ranges Option
      if (skipEmptyToggle.checked) {
        let attempts = 0;
        while (getItemsForRange(RANGES[nextIdx]).length === 0 && attempts < RANGES.length) {
          nextIdx = (nextIdx + 1) % RANGES.length;
          attempts++;
        }
      }

      switchRange(nextIdx);
    }

    // Switch to Previous Range
    function prevRange() {
      let prevIdx = (currentRangeIndex - 1 + RANGES.length) % RANGES.length;

      if (skipEmptyToggle.checked) {
        let attempts = 0;
        while (getItemsForRange(RANGES[prevIdx]).length === 0 && attempts < RANGES.length) {
          prevIdx = (prevIdx - 1 + RANGES.length) % RANGES.length;
          attempts++;
        }
      }

      switchRange(prevIdx);
    }

    // Switch Range directly
    function switchRange(index) {
      currentRangeIndex = index;
      timerProgressMs = 0;
      updateTimerUI();
      renderCurrentRangeView();
    }

    // Event Listeners
    playPauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playPauseIcon.setAttribute('data-lucide', 'pause');
        playPauseText.innerText = '一時停止';
      } else {
        playPauseIcon.setAttribute('data-lucide', 'play');
        playPauseText.innerText = '自動送りを再開';
      }
      lucide.createIcons();
    });

    prevBtn.addEventListener('click', () => {
      prevRange();
    });

    nextBtn.addEventListener('click', () => {
      nextRange();
    });

    reloadCsvBtn.addEventListener('click', () => {
      loadCSVData();
    });

    searchInput.addEventListener('input', () => {
      renderCurrentRangeView();
    });

    // Modal Control Logic
    function openModal(modal) {
      modal.classList.remove('hidden');
      
      // アンケート等に回答しやすいように、モーダル展開中はスライドショーを一時停止する
      if (isPlaying) {
        isPlaying = false;
        playPauseIcon.setAttribute('data-lucide', 'play');
        playPauseText.innerText = '自動送りを再開';
        lucide.createIcons();
      }
    }
    
    function closeModal(modal) {
      modal.classList.add('hidden');
    }

    // ユーザー追加リクエストのイベントリスナー
    requestUserBtn.addEventListener('click', () => openModal(requestModal));
    closeRequestBtn.addEventListener('click', () => closeModal(requestModal));
    closeRequestBtn2.addEventListener('click', () => closeModal(requestModal));
    requestModal.addEventListener('click', (e) => {
      if (e.target === requestModal) closeModal(requestModal);
    });

    // 基準のイベントリスナー
    criteriaBtn.addEventListener('click', () => openModal(criteriaModal));
    closeCriteriaBtn.addEventListener('click', () => closeModal(criteriaModal));
    closeCriteriaBtn2.addEventListener('click', () => closeModal(criteriaModal));
    criteriaModal.addEventListener('click', (e) => {
      if (e.target === criteriaModal) closeModal(criteriaModal);
    });

    // Global Key Bindings (Space for play/pause, Left/Right arrows)
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        playPauseBtn.click();
      } else if (e.code === 'ArrowRight') {
        nextRange();
      } else if (e.code === 'ArrowLeft') {
        prevRange();
      }
    });

    function processAndRender() {
      renderCurrentRangeView();
      startTimer();
    }

    // Initialize Application on Load
    window.onload = function() {
      lucide.createIcons();
      loadCSVData();
    };
  </script>
</body>
</html>
