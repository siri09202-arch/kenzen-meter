      { id: 'rn1_9',   label: '健全度 -1%〜-9%', color: 'from-amber-500 to-orange-500', textColor: 'text-amber-400' },
      { id: 'rn10_19', label: '健全度 -10%〜-19%', color: 'from-orange-500 to-amber-600', textColor: 'text-orange-400' },
      { id: 'rn20_29', label: '健全度 -20%〜-29%', color: 'from-orange-600 to-red-500', textColor: 'text-orange-400' },

      { id: 'rn40_49', label: '健全度 -40%〜-49%', color: 'from-red-600 to-red-400', textColor: 'text-red-400' },
      { id: 'rn50_59', label: '健全度 -50%〜-59%', color: 'from-red-700 to-red-500', textColor: 'text-red-400' },
      { id: 'rn60_69', label: '健全度 -60%〜-69%', color: 'from-rose-700 to-red-600', textColor: 'text-rose-400' },
      { id: 'rn70_79', label: '健全度 -70%〜-79%', color: 'from-rose-800 to-rose-600', textColor: 'text-rose-400' },
      { id: 'rn80_89', label: '健全度 -80%〜-89%', color: 'from-pink-900 to-rose-700', textColor: 'text-pink-400' },
      { id: 'rn90_100',label: '健全度 -90%〜-100%', color: 'from-purple-900 to-pink-800', textColor: 'text-purple-400' },
      { id: 'top5_healthy', label: '健全ランキング（Top5）', type: 'top5_healthy', color: 'from-emerald-400 to-teal-500', textColor: 'text-emerald-400' },
      { id: 'top5_unhealthy', label: '不健全ランキング（Top5）', type: 'top5_unhealthy', color: 'from-rose-500 to-purple-600', textColor: 'text-rose-400' },
      { id: 'average_val', label: '平均値', type: 'average', color: 'from-blue-500 to-indigo-500', textColor: 'text-blue-400' }
    ];

    let rawParsedData = [];
    let currentRangeIndex = 0;
    let isPlaying = true;
    let timerInterval = null;
    let timerProgressMs = 0;
    const TIMER_DURATION_MS = 10000;
    const TICK_INTERVAL_MS = 100;

    const SAMPLE_DATA = [
      { name: 'アルファプロジェクト', value: 95.5 },
      { name: 'ベータソリューションズ', value: 85.0 },
      { name: 'ガンマシステム', value: 72.4 },
      { name: 'デルタネットワークス', value: 64.2 },
      { name: 'エプシロンクラウド', value: 55.0 },
      { name: 'ゼータマーケティング', value: 45.3 },
      { name: 'イータロジスティクス', value: 35.1 },
      { name: 'シータエンジニアリング', value: 24.7 },
      { name: 'イオタホールディングス', value: 15.9 },
      { name: 'カッパフーズ', value: 5.4 },
      { name: 'ラムダケミカル', value: 0.0 },
      { name: 'ミューメディカル', value: -4.5 },
      { name: 'ニューマテリアル', value: -14.2 },
      { name: 'クシーエナジー', value: -25.6 },
      { name: 'オミクロンアパレル', value: -35.6 },
      { name: 'パイセキュリティ', value: -48.0 },
      { name: 'ローロボティクス', value: -55.4 },
      { name: 'シグマコンサルティング', value: -68.2 },
      { name: 'タウインターナショナル', value: -78.0 },
      { name: 'ウプシロンメディア', value: -85.3 },
      { name: 'ファイファイナンス', value: -95.1 }
    ];

    const reloadCsvBtn = document.getElementById('reloadCsvBtn');
    const statusText = document.getElementById('statusText');
    const statusIndicator = document.getElementById('statusIndicator');
    const currentRangeTitle = document.getElementById('currentRangeTitle');
    const rangeItemCount = document.getElementById('rangeItemCount');
    const rangeColorBadge = document.getElementById('rangeColorBadge');
    const chartItemsList = document.getElementById('chartItemsList');
    const emptyState = document.getElementById('emptyState');
    const emptyRangeName = document.getElementById('emptyRangeName');
    const totalDataCount = document.getElementById('totalDataCount');
    const timerProgress = document.getElementById('timerProgress');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playPauseIcon = document.getElementById('playPauseIcon');
    const playPauseText = document.getElementById('playPauseText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const skipEmptyToggle = document.getElementById('skipEmptyToggle');
    const searchInput = document.getElementById('searchInput');

    const requestUserBtn = document.getElementById('requestUserBtn');
    const requestModal = document.getElementById('requestModal');
    const closeRequestBtn = document.getElementById('closeRequestBtn');
    const closeRequestBtn2 = document.getElementById('closeRequestBtn2');

    const criteriaBtn = document.getElementById('criteriaBtn');
    const criteriaModal = document.getElementById('criteriaModal');
    const closeCriteriaBtn = document.getElementById('closeCriteriaBtn');
    const closeCriteriaBtn2 = document.getElementById('closeCriteriaBtn2');

    async function loadCSVData() {
      const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2ztMg-6X-h0X7h7eNavH0jfZgM8Epq8mlxBXM1pJ_WkicdklUxeE9EZ_L-IEU9AlgPuZNsnhbq3qX/pub?output=csv";
      setStatus('loading', 'CSVデータを取得中...');
      
      const reloadIcon = document.getElementById('reloadIcon');
      if (reloadIcon) reloadIcon.classList.add('animate-spin');

      let csvText = null;

      try {
        const response = await fetch(url);
        if (response.ok) {
          csvText = await response.text();
        }
      } catch (e) {
        console.warn('直接取得に失敗しました。プロキシ経由で試行します...', e);
      }

      if (!csvText || csvText.trim().length === 0) {
        try {
          const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
          const response = await fetch(proxyUrl);
          if (response.ok) {
            csvText = await response.text();
          }
        } catch (e) {
          console.warn('AllOriginsプロキシの取得に失敗しました', e);
        }
      }

      if (!csvText || csvText.trim().length === 0) {
        try {
          const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
          const response = await fetch(proxyUrl);
          if (response.ok) {
            csvText = await response.text();
          }
        } catch (e) {
          console.warn('CorsProxy取得失敗', e);
        }
      }

      if (reloadIcon) reloadIcon.classList.remove('animate-spin');

      if (csvText && csvText.trim().length > 0) {
        parseCSVText(csvText);
        setStatus('online', 'CSV同期完了');
      } else {
        rawParsedData = SAMPLE_DATA;
        setStatus('warning', 'サンプルデータ使用中 (取得失敗)');
        processAndRender();
      }
    }

    function parseCSVText(csvText) {
      Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            const data = [];
            const firstRow = results.data[0];
            const keys = Object.keys(firstRow);

            let nameKey = keys.find(k => k.match(/名前|項目|Name|銘柄|商品|タイトル/i)) || keys[0];
            let valueKey = keys.find(k => k.match(/数値|達成率|率|前日比|パーセント|Value|%|比率/i)) || keys[1] || keys[0];

            results.data.forEach(row => {
              const nameVal = row[nameKey];
              const rawVal = row[valueKey];

              if (nameVal !== undefined && rawVal !== undefined) {
                let cleanVal = String(rawVal).replace(/%/g, '').replace(/,/g, '').trim();
                let num = parseFloat(cleanVal);
                if (!isNaN(num)) {
                  if (Math.abs(num) <= 1 && Math.abs(num) > 0 && cleanVal.includes('.')) {
                    num = num * 100;
                  }
                  data.push({ name: String(nameVal).trim(), value: num });
                }
              }
            });

            if (data.length > 0) {
              rawParsedData = data;
              processAndRender();
            } else {
              rawParsedData = SAMPLE_DATA;
              processAndRender();
            }
          }
        },
        error: function(err) {
          console.error('CSV Parsing Error:', err);
          rawParsedData = SAMPLE_DATA;
          processAndRender();
        }
      });
    }

    function setStatus(type, msg) {
      statusText.innerText = msg;
      if (type === 'online') {
        statusIndicator.className = 'w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse';
      } else if (type === 'warning') {
        statusIndicator.className = 'w-2 h-2 rounded-full bg-amber-500 inline-block';
      } else {
        statusIndicator.className = 'w-2 h-2 rounded-full bg-indigo-500 inline-block animate-ping';
      }
    }

    function getItemsForRange(rangeDef) {
      if (!rawParsedData || rawParsedData.length === 0) return [];

      if (rangeDef.type === 'top5_healthy') {
        const sorted = [...rawParsedData].sort((a, b) => b.value - a.value);
        return sorted.slice(0, 5).map((item, idx) => ({ ...item, rank: idx + 1 }));
      }
      if (rangeDef.type === 'top5_unhealthy') {
        const sorted = [...rawParsedData].sort((a, b) => a.value - b.value);
        return sorted.slice(0, 5).map((item, idx) => ({ ...item, rank: idx + 1 }));
      }
      if (rangeDef.type === 'average') {
        const sum = rawParsedData.reduce((acc, curr) => acc + curr.value, 0);
        const avg = sum / rawParsedData.length;
        return [{ name: '全ユーザー平均', value: avg }];
      }

      return rawParsedData.filter(item => {
        const val = item.value;
        switch (rangeDef.id) {
          case 'r100_90': return val >= 90;
          case 'r89_80':  return val >= 80 && val < 90;
          case 'r79_70':  return val >= 70 && val < 80;
          case 'r69_60':  return val >= 60 && val < 70;
          case 'r59_50':  return val >= 50 && val < 60;
          case 'r49_40':  return val >= 40 && val < 50;
          case 'r39_30':  return val >= 30 && val < 40;
          case 'r29_20':  return val >= 20 && val < 30;
          case 'r19_10':  return val >= 10 && val < 20;
          case 'r9_1':    return val >= 1 && val < 10;
          case 'r0':      return Math.abs(val) < 0.0001;
          case 'rn1_9':   return val > -10 && val < 0;
          case 'rn10_19': return val > -20 && val <= -10;
          case 'rn20_29': return val > -30 && val <= -20;
          case 'rn30_39': return val > -40 && val <= -30;
          case 'rn40_49': return val > -50 && val <= -40;
          case 'rn50_59': return val > -60 && val <= -50;
          case 'rn60_69': return val > -70 && val <= -60;
          case 'rn70_79': return val > -80 && val <= -70;
          case 'rn80_89': return val > -90 && val <= -80;
          case 'rn90_100':return val <= -90;
          default: return false;
        }
      });
    }

    function renderCurrentRangeView() {
      const currentRange = RANGES[currentRangeIndex];
      
      currentRangeTitle.innerText = currentRange.label;
      rangeColorBadge.className = `w-4 h-10 rounded-lg bg-gradient-to-b ${currentRange.color} shadow-md`;

      let items = getItemsForRange(currentRange);
      
      const query = searchInput.value.trim().toLowerCase();
      if (query) {
        items = items.filter(i => i.name.toLowerCase().includes(query));
      }

      rangeItemCount.innerText = `${items.length} 件`;
      totalDataCount.innerText = rawParsedData.length;

      chartItemsList.innerHTML = '';

      if (items.length === 0) {
        chartItemsList.classList.add('hidden');
        emptyState.classList.remove('hidden');
        emptyRangeName.innerText = currentRange.label;
      } else {
        chartItemsList.classList.remove('hidden');
        emptyState.classList.add('hidden');

        if (!currentRange.type) {
          items.sort((a, b) => b.value - a.value);
        }

        const headerEl = document.createElement('div');
        headerEl.className = "flex items-stretch w-full bg-slate-800 text-slate-200 font-bold text-xs sm:text-sm border-b-2 border-slate-700";
        headerEl.innerHTML = `
          <div class="w-1/3 sm:w-1/4 flex-shrink-0 py-2.5 px-3 sm:px-4 border-r border-slate-700 flex items-center justify-start tracking-wider">
            ユーザー名
          </div>
          <div class="w-16 sm:w-20 flex-shrink-0 py-2.5 px-2 border-r border-slate-700 flex items-center justify-center tracking-wider">
            健全度
          </div>
          <div class="flex-1 py-2.5 px-3 sm:px-4"></div>
        `;
        chartItemsList.appendChild(headerEl);

        items.forEach(item => {
          const rowEl = document.createElement('div');
          rowEl.className = "flex items-stretch w-full bg-slate-950/40 border-b border-slate-800/80 last:border-b-0 hover:bg-slate-800/50 transition-colors";

          const absVal = Math.min(100, Math.max(0, Math.abs(item.value)));
          const barWidth = absVal;

          // 整数（四捨五入）にして「%」を付与、0以上の数値は+をつけない
          const valFormatted = `${Math.round(item.value)}%`;

          let displayNameHtml = `<span class="truncate">${item.name}</span>`;
          if (item.rank) {
            const rankBadgeColor = item.rank === 1 ? 'bg-amber-500 text-slate-950 font-black' :
                                   item.rank === 2 ? 'bg-slate-300 text-slate-950 font-black' :
                                   item.rank === 3 ? 'bg-amber-700 text-white font-bold' :
                                   'bg-slate-800 text-slate-300 border border-slate-700';
            displayNameHtml = `<span class="inline-flex items-center justify-center w-5 h-5 rounded-full text-xs mr-2 shrink-0 ${rankBadgeColor}">${item.rank}</span><span class="truncate">${item.name}</span>`;
          }

          rowEl.innerHTML = `
            <!-- Name Column (左揃え) -->
            <div class="w-1/3 sm:w-1/4 flex-shrink-0 py-3 px-3 sm:px-4 font-medium text-slate-200 text-sm md:text-base border-r border-slate-800/80 flex items-center min-w-0 justify-start">
              ${displayNameHtml}
            </div>

            <!-- Value Column -->
            <div class="w-16 sm:w-20 flex-shrink-0 py-3 px-2 font-mono font-bold ${currentRange.textColor} text-center text-sm md:text-base border-r border-slate-800/80 flex items-center justify-center">
              ${valFormatted}
            </div>

            <!-- Bar Graph Column (右側: グラフ＆数値) -->
            <div class="flex-1 py-3 px-3 sm:px-4 flex items-center min-w-0">
              <div class="w-full h-5 sm:h-7 overflow-hidden flex justify-start bg-slate-900/50 rounded-sm">
                <div 
                  class="h-full bg-gradient-to-r ${currentRange.color} transition-all duration-500 shadow-sm rounded-r-sm" 
                  style="width: ${barWidth}%;"
                ></div>
              </div>
            </div>
          `;

          chartItemsList.appendChild(rowEl);
        });
      }
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerProgressMs = 0;
      updateTimerUI();

      timerInterval = setInterval(() => {
        if (!isPlaying) return;

        timerProgressMs += TICK_INTERVAL_MS;
        updateTimerUI();

        if (timerProgressMs >= TIMER_DURATION_MS) {
          timerProgressMs = 0;
          nextRange();
        }
      }, TICK_INTERVAL_MS);
    }

    function updateTimerUI() {
      const percentage = (timerProgressMs / TIMER_DURATION_MS) * 100;
      timerProgress.style.width = `${percentage}%`;
    }

    function nextRange() {
      let nextIdx = (currentRangeIndex + 1) % RANGES.length;

      if (skipEmptyToggle.checked) {
        let attempts = 0;
        while (getItemsForRange(RANGES[nextIdx]).length === 0 && attempts < RANGES.length) {
          nextIdx = (nextIdx + 1) % RANGES.length;
          attempts++;
        }
      }

      switchRange(nextIdx);
    }

    function prevRange() {
      let prevIdx = (currentRangeIndex - 1 + RANGES.length) % RANGES.length;

      if (skipEmptyToggle.checked) {
        let attempts = 0;
        while (getItemsForRange(RANGES[prevIdx]).length === 0 && attempts < RANGES.length) {
          prevIdx = (prevIdx - 1 + RANGES.length) % RANGES.length;
          attempts++;
        }
      }

      switchRange(prevIdx);
    }

    function switchRange(index) {
      currentRangeIndex = index;
      timerProgressMs = 0;
      updateTimerUI();
      renderCurrentRangeView();
    }

    playPauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playPauseIcon.setAttribute('data-lucide', 'pause');
        playPauseText.innerText = '一時停止';
      } else {
        playPauseIcon.setAttribute('data-lucide', 'play');
        playPauseText.innerText = '自動送りを再開';
      }
      lucide.createIcons();
    });

    prevBtn.addEventListener('click', () => {
      prevRange();
    });

    nextBtn.addEventListener('click', () => {
      nextRange();
    });

    reloadCsvBtn.addEventListener('click', () => {
      loadCSVData();
    });

    searchInput.addEventListener('input', () => {
      renderCurrentRangeView();
    });

    function openModal(modal) {
      modal.classList.remove('hidden');
      if (isPlaying) {
        isPlaying = false;
        playPauseIcon.setAttribute('data-lucide', 'play');
        playPauseText.innerText = '自動送りを再開';
        lucide.createIcons();
      }
    }
    
    function closeModal(modal) {
      modal.classList.add('hidden');
    }

    requestUserBtn.addEventListener('click', () => openModal(requestModal));
    closeRequestBtn.addEventListener('click', () => closeModal(requestModal));
    closeRequestBtn2.addEventListener('click', () => closeModal(requestModal));
    requestModal.addEventListener('click', (e) => {
      if (e.target === requestModal) closeModal(requestModal);
    });

    criteriaBtn.addEventListener('click', () => openModal(criteriaModal));
    closeCriteriaBtn.addEventListener('click', () => closeModal(criteriaModal));
    closeCriteriaBtn2.addEventListener('click', () => closeModal(criteriaModal));
    criteriaModal.addEventListener('click', (e) => {
      if (e.target === criteriaModal) closeModal(criteriaModal);
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        playPauseBtn.click();
      } else if (e.code === 'ArrowRight') {
        nextRange();
      } else if (e.code === 'ArrowLeft') {
        prevRange();
      }
    });

    function processAndRender() {
      renderCurrentRangeView();
      startTimer();
    }

    window.onload = function() {
      lucide.createIcons();
      loadCSVData();
    };
  </script>
</body>
</html>
